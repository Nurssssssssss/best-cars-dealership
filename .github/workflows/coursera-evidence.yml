name: Coursera genuine evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    name: Run Django and capture actual evidence
    runs-on: ubuntu-latest
    env:
      DEMO_PASSWORD: DemoOnlyPass123!
      ADMIN_PASSWORD: DemoAdminPass123!
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: best-cars-dealership
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd server/frontend
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          sudo apt-get install -y xvfb scrot
      - name: Prepare a temporary demo database
        run: |
          python server/manage.py migrate --noinput
          python server/manage.py seed_demo
          python server/manage.py shell -c 'import os; from django.contrib.auth.models import User; from dealers.models import Dealer,Review; from datetime import date; u=User.objects.create_user(username="course_demo",password=os.environ["DEMO_PASSWORD"]); User.objects.create_superuser(username="root",email="root@example.invalid",password=os.environ["ADMIN_PASSWORD"]); Review.objects.create(dealer=Dealer.objects.first(),author=u,text="Fantastic services",rating=5,purchase_date=date(2026,10,20),car_make="Toyota",car_model="Camry",car_year=2023)'
      - name: Start application
        run: |
          mkdir -p evidence
          printf 'cd server && python3 manage.py runserver 0.0.0.0:8000\n' > evidence/django_server
          (cd server && python3 manage.py runserver 0.0.0.0:8000) >> evidence/django_server 2>&1 &
          (cd server/frontend && npm run dev -- --host 0.0.0.0 > ../../evidence/vite_server 2>&1) &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/fetchDealers >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat evidence/django_server
          cat evidence/vite_server
          exit 1
      - name: Capture real API cURL outputs
        run: python scripts/capture_real_coursera.py
      - name: Capture actual browser windows
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" node capture-evidence.mjs
        working-directory: best-cars-dealership/server/frontend
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursera-real-ci-evidence
          path: best-cars-dealership/evidence/
          retention-days: 14
