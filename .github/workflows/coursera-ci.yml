name: Coursera CI - Python and JavaScript lint
on:
  push:
  pull_request:
jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: best-cars-dealership
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: python -m compileall -q server
      - name: Run Django tests
        run: python server/manage.py test dealers
  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JSHint
        run: npm install --global jshint
      - name: Run Linter
        run: |
          cd best-cars-dealership/server/frontend
          npm install --no-audit --no-fund
          npm run build
