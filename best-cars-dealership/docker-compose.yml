services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    volumes:
      - django_data:/app/server/data
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["8081:8081"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: change-me-before-sharing
volumes:
  mongo_data:
  django_data:
